<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="/assets/favicon.png" />
        <link rel="stylesheet" href="/css/global.css" />
        <title>Lotly - Lotería de confianza</title>
    </head>
    <body class="page">
        <header class="header">
            <img src="/assets/logo.png" alt="Logo de Lotly" class="header__logo" />
            <p class="header__tagline">Lotería de confianza.</p>
        </header>

        <main class="main">
            <section class="lottery" aria-labelledby="lottery-title">
                <h1 id="lottery-title" class="lottery__title">Prueba tu suerte</h1>
                <p class="lottery__description">Adivina el número ganador y Gana!!!.</p>

                <form class="lottery__form" id="lottery-form">
                    <label for="input-user" class="lottery__label"> Ingresa un número del 1 al 10: </label>
                    <input
                        type="number"
                        id="input-user"
                        name="userNumber"
                        class="lottery__input"
                        placeholder="Ej. 7"
                        min="1"
                        max="10"
                        step="1"
                        required
                    />
                    <p class="lottery__error"></p>
                    <button type="submit" class="lottery__button">Jugar</button>
                </form>
                <button class="history__button">historial de jugadas</button>
                <dialog id="lottery__dialog" class="lottery-modal">
                    <div class="lottery-modal__content">
                        <h2 class="lottery-modal__title">
                            ¡Ups! Este no es numero<span id="number-user" class="lottery-modal__number-user">4</span>
                        </h2>
                        <p class="lottery-modal__text">
                            Tu número fue el <strong id="number-random" class="lottery-modal__number-random">0</strong>.
                        </p>
                        <div class="lottery-modal__footer">
                            <button id="btn-retry" class="lottery-btn lottery-btn--retry">Volver a intentarlo</button>
                        </div>
                    </div>
                </dialog>
                <div class="lottery__result" id="lottery-result" aria-live="polite"></div>
            </section>
        </main>

        <footer class="footer">
            <small class="footer__copyright">&copy; 2026 Lotly. Todos los derechos reservados.</small>
        </footer>

        <script type="module" src="/js/main.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    </body>
</html>
